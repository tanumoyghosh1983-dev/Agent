<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deal room — VirtualEmployee.com</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EB;--paper:#FFFFFF;--ink:#17130B;--body:#4B463B;--muted:#6E675A;--coral:#FF5A36;--butter:#FFD649;--mint:#B9EFD9;--mint-deep:#0E8A66;--teal:#0EA5A4;--line:rgba(23,19,11,.12);--ink-60:rgba(23,19,11,.6);--r:22px;--shadow:0 1px 2px rgba(23,19,11,.04),0 12px 32px -20px rgba(23,19,11,.2);}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh;}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.02em;line-height:1.12;}
a{color:inherit;text-decoration:none;}button{font-family:'Inter';cursor:pointer;border:none;}
.wrap{max-width:1080px;margin:0 auto;padding:0 clamp(18px,4vw,40px);}
header.top{border-bottom:1px solid var(--line);}
.top-inner{display:flex;align-items:center;justify-content:space-between;padding:16px 0;}
.brand{font-weight:700;font-size:19px;display:flex;align-items:center;gap:9px;}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--coral);}
.brand small{font-weight:600;font-size:12px;color:var(--ink-60);margin-left:2px;}
.top-cta{font-size:13px;font-weight:700;padding:10px 18px;border-radius:100px;background:var(--ink);color:var(--bg);}
.meta{text-align:center;padding:44px 0 8px;}
.meta .eyebrow{font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--coral);margin-bottom:10px;}
.meta h1{font-size:clamp(26px,4vw,38px);margin-bottom:8px;}
.meta p{font-size:14.5px;color:var(--muted);max-width:52ch;margin:0 auto;}
.grid{display:grid;grid-template-columns:340px 1fr;gap:40px;align-items:start;padding:30px 0 80px;}
@media(max-width:880px){.grid{grid-template-columns:1fr;}.phone-col{display:flex;justify-content:center;}}
.phone-shell{position:relative;background:linear-gradient(145deg,#3a3a3c,#1c1c1e 40%,#2c2c2e);border-radius:54px;padding:8px;width:320px;margin:0 auto;box-shadow:0 24px 56px -20px rgba(23,19,11,.35),0 4px 14px -4px rgba(23,19,11,.2),inset 0 0 0 1px rgba(255,255,255,.06);}
.phone-screen{background:var(--paper);border-radius:46px;overflow:hidden;height:640px;position:relative;display:flex;flex-direction:column;box-shadow:inset 0 0 0 2px rgba(0,0,0,.9);}
.phone-island{position:absolute;top:14px;left:50%;transform:translateX(-50%);width:96px;height:28px;background:#000;border-radius:20px;z-index:20;}
.app-frame{flex:1;overflow-y:auto;overflow-x:hidden;padding-top:44px;}.app-frame::-webkit-scrollbar{display:none;}
.nav-controls{display:flex;justify-content:center;gap:8px;margin-top:14px;}
.nav-controls button{border:1px solid var(--line);background:var(--paper);border-radius:100px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink-60);}
.nav-controls button:disabled{opacity:.35;}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px;margin-bottom:20px;}
.panel h3{font-size:17px;margin-bottom:12px;}
.est{background:var(--ink);color:var(--bg);border-radius:16px;padding:20px;}
.est .big{font-family:'Space Grotesk';font-weight:700;font-size:34px;line-height:1;}
.est .big small{font-size:14px;font-weight:600;color:rgba(244,242,235,.6);}
.est .row{display:flex;justify-content:space-between;font-size:13px;padding:7px 0;border-bottom:1px solid rgba(244,242,235,.14);}
.est .row:last-child{border:none;}.est .row span:first-child{color:rgba(244,242,235,.6);}
.g{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:16px 0 8px;}
.spec-summary{font-size:14px;color:var(--body);background:#FbFaf6;border-left:3px solid var(--coral);padding:12px 14px;border-radius:0 10px 10px 0;}
.pill{display:inline-block;font-size:12px;font-weight:600;background:var(--mint);color:var(--mint-deep);padding:4px 11px;border-radius:100px;margin:0 6px 6px 0;}
.screen-card{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;}
.screen-card .h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.screen-card .t{font-family:'Space Grotesk';font-weight:700;font-size:14.5px;}
.screen-card .eff{font-size:10.5px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px;background:var(--teal);}
.screen-card .eff.S{background:#7AA35B}.screen-card .eff.L{background:#D08A2E}.screen-card .eff.XL{background:var(--coral)}
.screen-card .p{font-size:12.5px;color:var(--muted);margin:5px 0 8px;}
.screen-card ul{list-style:none;}
.screen-card li{font-size:12.5px;color:var(--body);padding-left:14px;position:relative;margin-bottom:3px;}
.screen-card li::before{content:"›";position:absolute;left:0;color:var(--coral);font-weight:700;}
.cta{background:var(--ink);color:var(--bg);border-radius:16px;padding:24px;text-align:center;}
.cta h3{font-size:18px;margin-bottom:8px;color:var(--bg);}
.cta p{font-size:13.5px;color:rgba(244,242,235,.7);margin-bottom:16px;}
.cta a{display:inline-block;background:var(--coral);color:#fff;padding:12px 22px;border-radius:100px;font-size:13.5px;font-weight:700;}
.state{max-width:460px;text-align:center;padding:80px 20px;margin:0 auto;}
.state h2{font-size:20px;margin-bottom:8px;}.state p{font-size:14px;color:var(--muted);margin-bottom:18px;}
.state a{display:inline-block;background:var(--ink);color:var(--bg);padding:12px 24px;border-radius:100px;font-size:13.5px;font-weight:700;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--coral);display:inline-block;animation:pd 1s infinite ease-in-out;}
@keyframes pd{0%,100%{opacity:.3}50%{opacity:1}}
</style>
</head>
<body>
<header class="top"><div class="wrap top-inner">
  <div class="brand"><span class="dot" style="animation:none"></span>VirtualEmployee<small>Copilot</small></div>
  <a class="top-cta" href="/">Build your own →</a>
</div></header>

<main id="main"><div class="state"><span class="dot"></span><p style="margin-top:14px">Loading…</p></div></main>

<script>
function photoUrl(c,w,h){if(c&&c.resolved_image_url)return c.resolved_image_url;const q=(c&&c.image_query)||'app';return `https://picsum.photos/seed/${encodeURIComponent(q.toLowerCase().replace(/\s+/g,'-'))}/${w}/${h}`;}
const CARD_SHADOW='0 1px 2px rgba(23,19,11,.04),0 4px 12px -6px rgba(23,19,11,.10)';const GUTTER=18,RADIUS_LG=16,RADIUS_MD=12;
function componentHTML(c,accent){switch(c.kind){
  case 'header':return `<div style="font-family:'Space Grotesk';font-weight:700;font-size:20px;padding:4px 20px 14px;">${c.text||''}</div>`;
  case 'text':if(c.style==='heading')return `<div style="font-family:'Space Grotesk';font-weight:700;font-size:22px;padding:0 20px 10px;line-height:1.2;">${c.text||''}</div>`;if(c.style==='caption')return `<div style="font-size:12px;color:#8a8578;padding:0 20px 8px;">${c.text||''}</div>`;return `<div style="font-size:14px;line-height:1.5;padding:0 20px 12px;color:#3a352a;">${c.text||''}</div>`;
  case 'card':return `<div data-nav="${c.navTo||''}" style="margin:0 ${GUTTER}px 12px;padding:12px;border-radius:${RADIUS_LG}px;background:#fff;box-shadow:${CARD_SHADOW};display:flex;gap:12px;align-items:center;cursor:${c.navTo?'pointer':'default'};"><div style="width:56px;height:56px;border-radius:${RADIUS_MD}px;overflow:hidden;flex-shrink:0;background:#F0EEE6;"><img src="${photoUrl(c,112,112)}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"></div><div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:14.5px;">${c.title||''}</div><div style="font-size:12.5px;color:#8a8578;margin-top:3px;font-weight:500;">${c.subtitle||''}</div></div>${c.navTo?`<div style="color:${accent};font-size:17px;font-weight:600;">›</div>`:''}</div>`;
  case 'button':{const p=c.style!=='secondary';return `<div style="padding:6px ${GUTTER+2}px 12px;"><button data-nav="${c.navTo||''}" style="width:100%;padding:14px;border-radius:100px;border:${p?'none':'1.5px solid rgba(23,19,11,.15)'};background:${p?accent:'transparent'};color:${p?'#fff':'#17130B'};font-weight:700;font-size:14px;cursor:pointer;">${c.label||''}</button></div>`;}
  case 'input':return `<div style="padding:0 ${GUTTER+2}px 12px;"><div style="padding:13px 16px;border-radius:${RADIUS_MD}px;background:#F7F5EF;border:1px solid rgba(23,19,11,.1);color:#8a8578;font-size:13.5px;">${c.placeholder||''}</div></div>`;
  case 'quantity_stepper':{const q=c.quantity||1;const id='q'+Math.random().toString(36).slice(2,8);return `<div style="margin:0 ${GUTTER}px 10px;padding:12px 14px;border-radius:${RADIUS_MD}px;background:#fff;box-shadow:${CARD_SHADOW};display:flex;align-items:center;gap:12px;">${c.title?`<div style="flex:1;min-width:0;"><div style="font-weight:700;font-size:13.5px;">${c.title}</div>${c.subtitle?`<div style="font-size:11.5px;color:#8a8578;margin-top:2px;">${c.subtitle}</div>`:''}</div>`:'<div style="flex:1;"></div>'}<div style="display:flex;align-items:center;background:#F7F5EF;border-radius:100px;padding:2px;"><button style="width:28px;height:28px;border-radius:50%;border:none;background:#fff;font-size:15px;font-weight:700;color:${accent};" onclick="var e=document.getElementById('${id}');var v=parseInt(e.textContent);if(v>1)e.textContent=v-1;">−</button><span id="${id}" style="width:32px;text-align:center;font-weight:700;font-size:13.5px;">${q}</span><button style="width:28px;height:28px;border-radius:50%;border:none;background:${accent};font-size:15px;font-weight:700;color:#fff;" onclick="var e=document.getElementById('${id}');e.textContent=parseInt(e.textContent)+1;">+</button></div></div>`;}
  case 'list_row':return `<div data-nav="${c.navTo||''}" style="margin:0 ${GUTTER}px;padding:14px 4px;border-bottom:1px solid rgba(23,19,11,.07);display:flex;justify-content:space-between;align-items:center;cursor:${c.navTo?'pointer':'default'};"><div><div style="font-weight:700;font-size:14px;">${c.title||''}</div><div style="font-size:12px;color:#8a8578;margin-top:3px;font-weight:500;">${c.subtitle||''}</div></div><div style="font-size:12.5px;color:${accent};font-weight:700;margin-left:12px;">${c.trailing||(c.navTo?'›':'')}</div></div>`;
  case 'stat':{const m=String(c.value).match(/^(\d(?:\.\d)?)\s*(★|stars?)$/i);let v=c.value;if(m){const r=parseFloat(m[1]);const f=Math.round(r);v=`<span style="letter-spacing:1px;">${'★'.repeat(Math.min(f,5))}${'☆'.repeat(Math.max(5-f,0))}</span> <span style="font-size:13px;font-weight:700;color:#8a8578;">${r}</span>`;}return `<div style="display:inline-block;padding:14px 18px;margin:0 8px 12px ${GUTTER}px;background:#fff;box-shadow:${CARD_SHADOW};border-radius:${RADIUS_MD}px;text-align:center;"><div style="font-weight:800;font-size:${m?15:20}px;font-family:'Space Grotesk';color:${m?'#D4A017':'inherit'};">${v}</div><div style="font-size:11px;color:#8a8578;margin-top:3px;font-weight:600;">${c.label||''}</div></div>`;}
  case 'image_banner':{const h=c.full_bleed?220:140;const mg=c.full_bleed?'0 0 14px':'0 16px 14px';const rd=c.full_bleed?'0':'16px';return `<div style="margin:${mg};height:${h}px;border-radius:${rd};overflow:hidden;position:relative;"><img src="${photoUrl(c,500,h*2)}" style="width:100%;height:100%;object-fit:cover;" loading="lazy">${c.caption?`<div style="position:absolute;bottom:0;left:0;right:0;padding:20px 16px 12px;background:linear-gradient(180deg,transparent,rgba(0,0,0,.55));"><div style="color:#fff;font-size:14px;font-weight:700;">${c.caption}</div></div>`:''}</div>`;}
  case 'avatar':{const sm={small:32,medium:48,large:80};const sz=sm[c.size]||48;return `<div style="padding:8px 20px;"><div style="width:${sz}px;height:${sz}px;border-radius:50%;overflow:hidden;border:2px solid #fff;box-shadow:0 1px 4px rgba(23,19,11,.12);"><img src="${photoUrl(c,sz*2,sz*2)}" style="width:100%;height:100%;object-fit:cover;" loading="lazy"></div></div>`;}
  case 'map_placeholder':return `<div style="margin:0 16px 14px;height:180px;border-radius:16px;background:repeating-linear-gradient(45deg,#e8e5dc,#e8e5dc 10px,#f0eee6 10px,#f0eee6 20px);display:flex;align-items:center;justify-content:center;position:relative;"><div style="width:14px;height:14px;background:${accent};border-radius:50%;box-shadow:0 0 0 6px ${accent}33;"></div><div style="position:absolute;bottom:10px;font-size:11px;color:#8a8578;background:#fff;padding:4px 10px;border-radius:100px;">${c.caption||'Live location'}</div></div>`;
  case 'divider':return `<div style="height:1px;background:rgba(23,19,11,.08);margin:8px 20px;"></div>`;
  case 'spacer':return `<div style="height:14px;"></div>`;
  case 'tabbar':{const items=c.items||[];const IC={home:'⌂',explore:'◎',search:'⚲',discover:'◎',browse:'▤',cart:'⛃',bag:'⛃',shop:'⛃',orders:'▤',order:'▤',bookings:'▤',booking:'▤',trips:'▤',chat:'✉',messages:'✉',message:'✉',inbox:'✉',activity:'◔',profile:'◉',account:'◉',you:'◉',me:'◉',favorites:'♡',wishlist:'♡',saved:'♡',likes:'♡',dashboard:'▦',analytics:'▦',stats:'▦',cards:'▭',wallet:'▭',payments:'▭',payment:'▭',billing:'▭',groups:'◈',community:'◈',social:'◈',post:'+',add:'+',record:'●',map:'⚑',tracking:'⚑',track:'⚑',nearby:'⚑'};function ic(l,i){const k=(l||'').toLowerCase().trim();if(IC[k])return IC[k];for(const w of k.split(/[\s_-]+/))if(IC[w])return IC[w];return ['⌂','◎','▤','◉','☰'][i%5];}return `<div style="position:sticky;bottom:0;background:#fff;border-top:1px solid rgba(23,19,11,.08);display:flex;padding:8px 0;margin-top:auto;">${items.map((it,i)=>{const nid=(c.navMap&&c.navMap[it])||'';const act=nid&&nid===(window.__cur||'');return `<div data-nav="${nid}" style="flex:1;text-align:center;cursor:${nid?'pointer':'default'};position:relative;padding-top:2px;">${act?`<div style="position:absolute;top:0;left:50%;transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:${accent};"></div>`:''}<div style="font-size:18px;color:${act?accent:'#8a8578'};">${ic(it,i)}</div><div style="font-size:10px;margin-top:3px;color:${act?accent:'#8a8578'};font-weight:${act?'800':'600'};">${it}</div></div>`;}).join('')}</div>`;}
  default:return '';
}}
let proto=null,navStack=[],cur=null;
function renderScreen(id){const s=proto.screens.find(x=>x.id===id);if(!s)return;cur=id;window.__cur=id;const accent=proto.primaryColor||'#FF5A36';const f=document.getElementById('appFrame');f.style.display='flex';f.style.flexDirection='column';f.innerHTML=`<div style="display:flex;flex-direction:column;min-height:100%;">${s.components.map(c=>componentHTML(c,accent)).join('')}</div>`;f.querySelectorAll('[data-nav]').forEach(el=>{const n=el.getAttribute('data-nav');if(n)el.addEventListener('click',()=>navTo(n));});const b=document.getElementById('navBack');if(b)b.disabled=navStack.length<1;}
function navTo(id){if(cur)navStack.push(cur);renderScreen(id);}
function navBack(){if(navStack.length)renderScreen(navStack.pop());}
function navHome(){navStack=[];renderScreen(proto.startScreen);}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function money(n){return '$'+Math.round(n).toLocaleString();}

async function load(){
  const id=new URLSearchParams(location.search).get('id');
  const main=document.getElementById('main');
  if(!id){main.innerHTML=`<div class="state"><h2>No link provided</h2><p>This page needs a valid deal link.</p><a href="/">Build a new one</a></div>`;return;}
  const DELAYS=[1000,2000,4000,8000,15000];let lastErr='This link may be broken or expired.';
  for(let a=0;a<=DELAYS.length;a++){
    try{
      const res=await fetch('/.netlify/functions/get-deal?id='+encodeURIComponent(id));
      const data=await res.json();
      if(res.ok){render(data);return;}
      lastErr=data.error||lastErr;
      if(res.status!==404)break;
    }catch(e){lastErr='Something went wrong while loading.';}
    if(a<DELAYS.length){main.innerHTML=`<div class="state"><span class="dot"></span><p style="margin-top:14px">This link was just created — checking again…</p></div>`;await new Promise(r=>setTimeout(r,DELAYS[a]));}
  }
  main.innerHTML=`<div class="state"><h2>Couldn't load this deal</h2><p>${esc(lastErr)}</p><a href="/">Build your own</a></div>`;
}

function render(deal){
  proto=deal.prototype;
  const e=deal.estimate, spec=deal.spec;
  const main=document.getElementById('main');
  const estHTML=e?`<div class="panel"><h3>Estimate</h3><div class="est"><div class="big">${money(e.total)} <small>starting estimate</small></div><div style="margin-top:14px"><div class="row"><span>Timeline</span><b>${esc(e.timeline)}</b></div><div class="row"><span>Platform</span><b>${esc(e.platformLabel)}</b></div><div class="row"><span>Scope</span><b>${esc(e.sizeLabel)}</b></div><div class="row"><span>Recommended</span><b>${esc(e.recommendedPackage?.name||'')}</b></div></div></div></div>`:'';
  let specHTML='';
  if(spec){
    const screens=(spec.screens||[]).map(s=>`<div class="screen-card"><div class="h"><span class="t">${esc(s.title||s.id)}</span><span class="eff ${esc(s.effort||'M')}">${esc(s.effort||'M')}</span></div><div class="p">${esc(s.purpose||'')}</div>${(s.userStories||[]).length?`<ul>${s.userStories.map(u=>`<li>${esc(u)}</li>`).join('')}</ul>`:''}</div>`).join('');
    specHTML=`<div class="panel"><h3>Build plan</h3><div class="spec-summary">${esc(spec.summary||'')}</div>${(spec.targetUsers||[]).length?`<div class="g">Target users</div><div>${spec.targetUsers.map(u=>`<span class="pill">${esc(u)}</span>`).join('')}</div>`:''}<div class="g">Screens &amp; user stories</div>${screens}${(spec.integrations||[]).length?`<div class="g">Integrations</div><div>${spec.integrations.map(i=>`<span class="pill" style="background:#E7EEFE;color:#2B4B8F">${esc(i)}</span>`).join('')}</div>`:''}</div>`;
  }
  main.innerHTML=`
    <div class="wrap"><div class="meta"><div class="eyebrow">Shared deal room</div><h1>${esc(proto.appName||'App concept')}</h1><p>${esc(deal.idea||'Tap through the prototype, review the estimate and build plan.')}</p></div>
    <div class="grid">
      <div class="phone-col"><div class="phone-shell"><div class="phone-screen"><div class="phone-island"></div><div class="app-frame" id="appFrame"></div></div></div>
      <div class="nav-controls"><button id="navBack" onclick="navBack()">← Back</button><button onclick="navHome()">Home</button></div></div>
      <div>${estHTML}${specHTML}
        <div class="cta"><h3>Ready to build this for real?</h3><p>This is a simulated concept. The real thing includes production engineering, backends, and integrations. Let's scope it together.</p><a href="https://www.virtualemployee.com" target="_blank" rel="noopener">Talk to the team →</a></div>
      </div>
    </div></div>`;
  navStack=[];renderScreen(proto.startScreen);
}
load();
</script>
</body>
</html>
